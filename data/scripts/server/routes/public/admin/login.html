<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Admin Login — COREX SCRIPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, Arial, sans-serif;
      background: #030303;
      color: #fff;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      background:
        radial-gradient(circle at 50% 15%, rgba(255,255,255,.08), transparent 30%),
        radial-gradient(circle at 15% 80%, rgba(255,255,255,.035), transparent 28%),
        #030303;
    }

    .grid {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .18;
      background-image:
        linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
      background-size: 42px 42px;
      mask-image: linear-gradient(to bottom, transparent, black 25%, black 75%, transparent);
    }

    .login-glow {
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(255,255,255,.045);
      filter: blur(90px);
      pointer-events: none;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      position: relative;
      z-index: 2;
      padding: 36px;
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 24px;
      background: rgba(10,10,10,.78);
      box-shadow:
        0 30px 90px rgba(0,0,0,.7),
        inset 0 1px 0 rgba(255,255,255,.045);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 34px;
    }

    .brand-icon {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: #fff;
      color: #000;
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 8px 30px rgba(255,255,255,.08);
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    .brand-sub {
      margin-top: 3px;
      color: #777;
      font-size: 11px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: #888;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -.04em;
    }

    .subtitle {
      margin: 11px 0 0;
      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    form {
      margin-top: 29px;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: #bdbdbd;
      font-size: 12px;
      font-weight: 700;
    }

    .input-wrap {
      position: relative;
    }

    input {
      width: 100%;
      height: 52px;
      padding: 0 15px;
      border: 1px solid #242424;
      border-radius: 13px;
      outline: none;
      background: #090909;
      color: #fff;
      font-size: 14px;
      transition: .2s ease;
    }

    input::placeholder {
      color: #4d4d4d;
    }

    input:focus {
      border-color: #555;
      background: #0d0d0d;
      box-shadow: 0 0 0 3px rgba(255,255,255,.045);
    }

    #password {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;
      top: 50%;
      right: 9px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 9px;
      padding: 7px 9px;
      background: transparent;
      color: #777;
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
    }

    .show-password:hover {
      color: #fff;
      background: #151515;
    }

    .error-box {
      display: none;
      margin: 4px 0 14px;
      padding: 12px 13px;
      border: 1px solid rgba(255,80,80,.2);
      border-radius: 11px;
      background: rgba(255,60,60,.06);
      color: #ff8b8b;
      font-size: 12px;
      line-height: 1.5;
    }

    .login-btn {
      width: 100%;
      height: 52px;
      border: 0;
      border-radius: 13px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-size: 13px;
      font-weight: 800;
      transition: .2s ease;
    }

    .login-btn:hover {
      transform: translateY(-1px);
      background: #e9e9e9;
      box-shadow: 0 12px 30px rgba(255,255,255,.08);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .security-note {
      margin: 23px 0 0;
      padding-top: 18px;
      border-top: 1px solid #191919;
      color: #555;
      text-align: center;
      font-size: 11px;
      line-height: 1.5;
    }

    .security-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      margin-right: 5px;
      border-radius: 50%;
      background: #777;
    }

    @media (max-width: 480px) {
      .login-page {
        padding: 16px;
      }

      .login-card {
        padding: 27px 22px;
        border-radius: 20px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <main class="login-page">
    <div class="grid"></div>
    <div class="login-glow"></div>

    <section class="login-card">

      <div class="brand">
        <div class="brand-icon">C</div>
        <div>
          <div class="brand-name">COREX SCRIPT</div>
          <div class="brand-sub">Owner Control Panel</div>
        </div>
      </div>

      <p class="eyebrow">Restricted Access</p>

      <h1>Welcome back.</h1>

      <p class="subtitle">
        Sign in to manage your scripts, content, and administration settings.
      </p>

      <form id="loginForm">

        <div class="field">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            placeholder="Enter your username"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>

          <div class="input-wrap">
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Enter your password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
            >Show</button>
          </div>
        </div>

        <div
          class="error-box"
          id="loginError"
          role="alert"
        ></div>

        <button
          type="submit"
          class="login-btn"
          id="loginBtn"
        >
          Sign in
        </button>

      </form>

      <div class="security-note">
        <span class="security-dot"></span>
        Secure owner authentication
      </div>

    </section>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const username = document.getElementById('username');
    const password = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');
    const showPassword = document.getElementById('showPassword');

    showPassword.addEventListener('click', () => {
      const visible = password.type === 'text';

      password.type = visible ? 'password' : 'text';
      showPassword.textContent = visible ? 'Show' : 'Hide';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      loginError.style.display = 'none';
      loginError.textContent = '';

      loginBtn.disabled = true;
      loginBtn.textContent = 'Signing in...';

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'same-origin',
          body: JSON.stringify({
            username: username.value.trim(),
            password: password.value
          })
        });

        let data = {};

        try {
          data = await res.json();
        } catch {
          data = {};
        }

        if (!res.ok) {
          loginError.textContent =
            data.error || 'Invalid username or password.';
          loginError.style.display = 'block';
          return;
        }

        loginBtn.textContent = 'Success ✓';

        setTimeout(() => {
          window.location.href = '/admin/index.html';
        }, 300);

      } catch (error) {
        loginError.textContent =
          'Unable to connect to the server. Please try again.';
        loginError.style.display = 'block';
      } finally {
        if (!loginBtn.textContent.includes('Success')) {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign in';
        }
      }
    });
  </script>

</body>
  </html>
