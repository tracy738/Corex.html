<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030303">
  <title>Staff Access — COREX SCRIPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: Inter, Arial, sans-serif;
      background: #030303;
      color: #fff;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(255,255,255,.07),
          transparent 32%
        ),
        #030303;
    }

    .grid {
      position: absolute;
      inset: 0;
      opacity: .12;
      pointer-events: none;

      background-image:
        linear-gradient(
          rgba(255,255,255,.045) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.045) 1px,
          transparent 1px
        );

      background-size: 44px 44px;
    }

    .glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,.035);
      filter: blur(100px);
      pointer-events: none;
    }

    .card {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 430px;
      padding: 38px;

      border: 1px solid rgba(255,255,255,.11);
      border-radius: 24px;

      background: rgba(10,10,10,.82);

      box-shadow:
        0 35px 100px rgba(0,0,0,.75),
        inset 0 1px 0 rgba(255,255,255,.04);

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 35px;
    }

    .logo {
      width: 44px;
      height: 44px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      background: #fff;
      color: #000;

      font-size: 18px;
      font-weight: 900;
    }

    .brand-name {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .13em;
    }

    .brand-sub {
      margin-top: 3px;
      color: #666;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin: 0 0 9px;

      color: #777;

      font-size: 10px;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: 30px;
      line-height: 1.15;
      letter-spacing: -.04em;
    }

    .description {
      margin: 12px 0 28px;

      color: #777;
      font-size: 14px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 8px;

      color: #aaa;
      font-size: 12px;
      font-weight: 700;
    }

    input {
      width: 100%;
      height: 52px;

      padding: 0 15px;

      border: 1px solid #252525;
      border-radius: 13px;

      outline: none;

      background: #080808;
      color: #fff;

      font-size: 14px;

      transition: .2s ease;
    }

    input::placeholder {
      color: #4d4d4d;
    }

    input:focus {
      border-color: #555;
      background: #0c0c0c;
      box-shadow:
        0 0 0 3px rgba(255,255,255,.04);
    }

    .error {
      display: none;

      margin: 5px 0 14px;
      padding: 12px 13px;

      border: 1px solid rgba(255,70,70,.2);
      border-radius: 11px;

      background: rgba(255,50,50,.06);

      color: #ff8c8c;

      font-size: 12px;
      line-height: 1.5;
    }

    .continue-btn {
      width: 100%;
      height: 52px;

      border: 0;
      border-radius: 13px;

      background: #fff;
      color: #000;

      cursor: pointer;

      font-size: 13px;
      font-weight: 800;

      transition: .2s ease;
    }

    .continue-btn:hover {
      background: #e9e9e9;
      transform: translateY(-1px);
      box-shadow:
        0 12px 30px rgba(255,255,255,.08);
    }

    .continue-btn:active {
      transform: translateY(0);
    }

    .continue-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
    }

    .security {
      margin-top: 24px;
      padding-top: 18px;

      border-top: 1px solid #191919;

      color: #555;

      font-size: 11px;
      line-height: 1.5;

      text-align: center;
    }

    .dot {
      display: inline-block;

      width: 6px;
      height: 6px;

      margin-right: 5px;

      border-radius: 50%;
      background: #777;
    }

    @media (max-width: 480px) {
      .card {
        padding: 27px 22px;
        border-radius: 20px;
      }

      h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <div class="grid"></div>
    <div class="glow"></div>

    <section class="card">

      <div class="brand">
        <div class="logo">C</div>

        <div>
          <div class="brand-name">
            COREX SCRIPT
          </div>

          <div class="brand-sub">
            Staff Control Panel
          </div>
        </div>
      </div>

      <p class="eyebrow">
        Staff Access
      </p>

      <h1>
        Welcome back.
      </h1>

      <p class="description">
        Please enter the authorized staff email
        to continue to the administration panel.
      </p>

      <form id="loginForm">

        <div class="field">
          <label for="email">
            Staff Email
          </label>

          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="Enter staff email"
            required
            autofocus
          >
        </div>

        <div
          class="error"
          id="loginError"
          role="alert"
        ></div>

        <button
          class="continue-btn"
          id="loginBtn"
          type="submit"
        >
          Continue
        </button>

      </form>

      <div class="security">
        <span class="dot"></span>
        Authorized staff access only
      </div>

    </section>

  </main>

  <script>
    const form = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const loginBtn = document.getElementById('loginBtn');
    const loginError = document.getElementById('loginError');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();

      loginError.style.display = 'none';
      loginError.textContent = '';

      loginBtn.disabled = true;
      loginBtn.textContent = 'Checking...';

      try {
        const response = await fetch('/api/admin/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          credentials: 'same-origin',
          body: JSON.stringify({
            email: email.value.trim()
          })
        });

        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }

        if (!response.ok) {
          loginError.textContent =
            data.error || 'Access denied.';
          loginError.style.display = 'block';

          return;
        }

        loginBtn.textContent = 'Access granted ✓';

        window.location.href = '/admin/index.html';

      } catch (error) {
        console.error(error);

        loginError.textContent =
          'Unable to connect to the server. Please try again.';

        loginError.style.display = 'block';

      } finally {
        if (
          loginBtn.textContent !== 'Access granted ✓'
        ) {
          loginBtn.disabled = false;
          loginBtn.textContent = 'Continue';
        }
      }
    });
  </script>

</body>
  </html>
