<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#030303">

  <title>Staff Access — COREX SCRIPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #030303;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    .page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(
          circle at center,
          rgba(255,255,255,.055),
          transparent 40%
        ),
        #030303;
    }

    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px;

      background: rgba(12,12,12,.9);
      border: 1px solid #222;
      border-radius: 22px;

      box-shadow: 0 30px 80px rgba(0,0,0,.7);
    }

    .logo {
      width: 45px;
      height: 45px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 13px;
      background: #fff;
      color: #000;

      font-size: 19px;
      font-weight: 900;

      margin-bottom: 25px;
    }

    .eyebrow {
      color: #777;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: .16em;
      text-transform: uppercase;
      margin: 0 0 8px;
    }

    h1 {
      margin: 0;
      font-size: 29px;
    }

    .description {
      color: #777;
      font-size: 13px;
      line-height: 1.6;
      margin: 12px 0 25px;
    }

    label {
      display: block;
      color: #aaa;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 52px;

      padding: 0 15px;

      border: 1px solid #292929;
      border-radius: 12px;

      outline: none;

      background: #080808;
      color: white;

      font-size: 14px;
    }

    input:focus {
      border-color: #555;
      box-shadow: 0 0 0 3px rgba(255,255,255,.04);
    }

    button {
      width: 100%;
      height: 52px;

      margin-top: 15px;

      border: 0;
      border-radius: 12px;

      background: #fff;
      color: #000;

      font-weight: 800;
      cursor: pointer;

      transition: .2s;
    }

    button:hover {
      background: #e8e8e8;
    }

    button:disabled {
      opacity: .55;
      cursor: wait;
    }

    .error {
      display: none;

      margin-top: 14px;
      padding: 11px;

      border-radius: 10px;

      background: rgba(255,60,60,.08);
      border: 1px solid rgba(255,60,60,.2);

      color: #ff9292;
      font-size: 12px;
    }

    /* Loading screen */

    .loading {
      display: none;

      position: fixed;
      inset: 0;

      z-index: 100;

      align-items: center;
      justify-content: center;
      flex-direction: column;

      background: #030303;
    }

    .spinner {
      width: 38px;
      height: 38px;

      border: 3px solid #222;
      border-top-color: #fff;

      border-radius: 50%;

      animation: spin .8s linear infinite;

      margin-bottom: 20px;
    }

    .loading-title {
      font-size: 15px;
      font-weight: 700;
    }

    .loading-text {
      color: #666;
      font-size: 12px;
      margin-top: 7px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="card">

      <div class="logo">C</div>

      <p class="eyebrow">
        COREX SCRIPT
      </p>

      <h1>
        Staff Access
      </h1>

      <p class="description">
        Enter the authorized staff email to
        continue to the administration panel.
      </p>

      <form id="loginForm">

        <label for="email">
          Staff Email
        </label>

        <input
          id="email"
          type="email"
          autocomplete="email"
          placeholder="Enter staff email"
          required
          autofocus
        >

        <div
          id="error"
          class="error"
        ></div>

        <button
          id="loginButton"
          type="submit"
        >
          Continue
        </button>

      </form>

    </section>

  </main>

  <!-- Loading screen -->

  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    <div class="loading-title">
      Checking staff access
    </div>

    <div class="loading-text">
      Please wait...
    </div>

  </div>

  <script>
    const form =
      document.getElementById('loginForm');

    const email =
      document.getElementById('email');

    const button =
      document.getElementById('loginButton');

    const error =
      document.getElementById('error');

    const loading =
      document.getElementById('loading');


    form.addEventListener('submit', async (event) => {

      event.preventDefault();

      error.style.display = 'none';
      error.textContent = '';

      const value =
        email.value.trim().toLowerCase();

      if (!value) {
        error.textContent =
          'Please enter the staff email.';

        error.style.display = 'block';

        return;
      }

      button.disabled = true;
      button.textContent = 'Checking...';

      loading.style.display = 'flex';

      try {

        const response = await fetch(
          '/api/admin/login',
          {
            method: 'POST',

            credentials: 'same-origin',

            headers: {
              'Content-Type': 'application/json'
            },

            body: JSON.stringify({
              email: value
            })
          }
        );

        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }

        if (!response.ok) {

          loading.style.display = 'none';

          error.textContent =
            data.error ||
            'Access denied.';

          error.style.display = 'block';

          button.disabled = false;
          button.textContent = 'Continue';

          return;
        }

        /*
         * The server has successfully created
         * the session cookie.
         *
         * Give the browser a tiny moment to
         * commit the Set-Cookie header before
         * navigating.
         */

        document.querySelector(
          '.loading-text'
        ).textContent =
          'Access verified. Opening panel...';

        setTimeout(() => {
          window.location.replace(
            '/admin/index.html'
          );
        }, 250);

      } catch (err) {

        console.error(err);

        loading.style.display = 'none';

        error.textContent =
          'Unable to connect to the server.';

        error.style.display = 'block';

        button.disabled = false;
        button.textContent = 'Continue';
      }

    });
  </script>

</body>
          </html>
