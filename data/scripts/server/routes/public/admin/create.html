<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Script — COREX SCRIPT</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="navbar-mount"></div>

  <div class="admin-layout">
    <div id="admin-sidebar-mount"></div>
    <div class="admin-main">
      <h1 class="page-title" style="font-size:24px">Add Script</h1>
      <p class="page-sub">This will be published immediately and visible to all visitors.</p>
      <div style="max-width:640px;margin-top:24px" id="formMount"></div>
    </div>
  </div>

  <div id="footer-mount"></div>

  <script src="/js/common.js"></script>
  <script src="/js/admin-common.js"></script>
  <script src="/js/admin-form.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const admin = await initAdminShell('/admin/create.html');
      if (!admin) return;
      renderScriptForm('formMount', { mode: 'create' });
    });
  </script>
</body>
</html>
